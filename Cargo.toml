[package]
name = "swarmforge"
version = "1.3.0"
edition = "2021"
authors = ["Bryan P. White <crvscience.com>"]
description = "SwarmForge: 3D Isometric Automated Robotic Factory & Swarm Intelligence Simulation Game"
license = "MIT"

[dependencies]
eframe = "0.31"
egui = "0.31"
glam = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
