[package]
name = "swarmforge"
version = "1.3.0"
edition = "2021"
authors = ["Bryan P. White <crvscience.com>"]
description = "SwarmForge: 3D Isometric Automated Robotic Factory & Swarm Intelligence Simulation Game"
license = "GPL-3.0-or-later"
homepage = "https://crvscience.com/apps"
repository = "https://github.com/bpwhite/crvscience-swarmforge"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
glam = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
png = "0.17"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
